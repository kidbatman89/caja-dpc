<title>Milo Drinks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFFAF2;
    --surface:#FFFFFF;
    --surface-2:#E3F5E9;
    --ink:#0E140F;
    --muted:#5B6B60;
    --primary:#2FAE60;
    --primary-ink:#FFFFFF;
    --primary-soft:#DCF3E4;
    --accent:#178A4C;
    --accent-soft:#D7F0E0;
    --danger:#C0392B;
    --danger-soft:#FBEAE8;
    --border: rgba(14,20,15,0.12);
    --shadow: 0 1px 2px rgba(14,20,15,0.06), 0 8px 24px rgba(14,20,15,0.10);
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
    --font-display:'Baloo 2', 'Poppins', system-ui, sans-serif;
    --font-body:'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B120D; --surface:#121A14; --surface-2:#182219; --ink:#EAF5EC; --muted:#93A79B;
      --primary:#3FD17A; --primary-ink:#06170D; --primary-soft:#173A26; --accent:#57E091; --accent-soft:#173A26;
      --danger:#FF8A7A; --danger-soft:#3A1D1A; --border: rgba(234,245,236,0.16);
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B120D; --surface:#121A14; --surface-2:#182219; --ink:#EAF5EC; --muted:#93A79B;
    --primary:#3FD17A; --primary-ink:#06170D; --primary-soft:#173A26; --accent:#57E091; --accent-soft:#173A26;
    --danger:#FF8A7A; --danger-soft:#3A1D1A; --border: rgba(234,245,236,0.16);
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  h1,h2,h3,h4{ font-family:var(--font-display); margin:0; text-wrap:balance; }
  p{ margin:0; }
  ::selection{ background:var(--primary-soft); }
  :focus-visible{ outline:2px solid var(--primary); outline-offset:2px; border-radius:4px; }

  .num{ font-variant-numeric: tabular-nums; }

  /* ---------- layout shell ---------- */
  #app{ min-height:100%; display:flex; flex-direction:column; }

  .topbar{
    position:sticky; top:0; z-index:70;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:10px 16px;
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  @media (min-width:480px){ .topbar{ padding:10px 20px; } }
  .topbar-left{ display:flex; align-items:center; gap:6px; min-width:0; flex:1 1 auto; overflow:hidden; }
  .hamburger-btn{ display:none; flex:none; }
  @media (max-width:1023px){ .hamburger-btn{ display:inline-flex; } }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-logo{ width:36px; height:36px; border-radius:11px; flex:none; object-fit:cover; box-shadow:var(--shadow); }
  .brand-text{ min-width:0; }
  .brand-name{ font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:-0.01em; line-height:1.15; }
  .brand-sub{ font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar-meta{ display:flex; align-items:center; gap:6px; flex:none; }
  .topbar-date{ font-size:12.5px; color:var(--muted); text-align:right; display:none; }
  @media (min-width:640px){ .topbar-date{ display:block; } }

  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:40px; height:40px; border-radius:50%; flex:none;
    background:transparent; border:1px solid transparent; color:var(--ink);
    transition: background .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{ background:var(--surface-2); border-color:var(--border); }
  .icon{ width:19px; height:19px; }
  @media (max-width:1023px){
    .icon-btn{ width:42px; height:42px; }
    .btn{ min-height:42px; }
    .btn-sm{ min-height:36px; }
    .stepper button{ width:32px; height:32px; }
    .navbtn{ padding:13px 14px !important; font-size:14.5px !important; }
  }

  .shell{ flex:1; display:flex; min-height:0; position:relative; }

  .sidenav{
    flex:none; width:212px; padding:18px 12px; display:flex; flex-direction:column; gap:4px;
    border-right:1px solid var(--border); background:var(--surface); overflow-y:auto;
  }
  .navbtn{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:10px 12px; border-radius:var(--radius-md); border:1px solid transparent; background:transparent;
    color:var(--muted); font-weight:600; font-size:13.5px;
    transition: background .15s ease, color .15s ease;
  }
  .navbtn .icon{ flex:none; }
  .navbtn:hover{ background:var(--surface-2); color:var(--ink); }
  .navbtn[aria-current="page"]{ background:var(--primary-soft); color:var(--accent); }
  .navbtn[aria-current="page"] svg{ color:var(--accent); }

  .nav-backdrop{ display:none; }
  @media (max-width:1023px){
    .sidenav{
      position:fixed; top:0; left:0; bottom:0; z-index:80; width:264px; max-width:82vw;
      transform:translateX(-100%); transition:transform .25s ease; box-shadow:var(--shadow);
      padding-top:calc(16px + env(safe-area-inset-top));
    }
    .sidenav.open{ transform:translateX(0); }
    .nav-backdrop{
      display:block; position:fixed; inset:0; background:rgba(8,14,10,0.45); z-index:75;
      opacity:0; pointer-events:none; transition:opacity .2s ease;
    }
    .nav-backdrop.open{ opacity:1; pointer-events:auto; }
  }

  .content{ flex:1; min-width:0; padding:20px 16px 48px; max-width:1180px; margin:0 auto; width:100%; }
  @media (min-width:640px){ .content{ padding:22px 22px 56px; } }
  @media (max-width:374px){ .content{ padding:14px 12px 40px; } }

  .view[hidden]{ display:none; }

  .view-header{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .view-title{ font-size:22px; font-weight:600; }
  .view-desc{ color:var(--muted); font-size:13px; margin-top:2px; }
  .section-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:22px 0 10px; }
  .section-label:first-child{ margin-top:0; }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 16px; border-radius:var(--radius-md); border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-weight:600; font-size:13.5px;
    transition: background .15s ease, border-color .15s ease, transform .05s ease;
    white-space:nowrap;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-ghost{ background:transparent; border-color:transparent; }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ background:var(--danger-soft); border-color:transparent; color:var(--danger); }
  .btn-danger:hover{ filter:brightness(0.97); }
  .btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:var(--radius-sm); }
  .btn-block{ width:100%; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }

  /* ---------- cards / stats ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); }
  .grid-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px; margin-bottom:16px; }
  .stat{ padding:16px 16px 14px; border-top:3px solid var(--primary); }
  .stat-danger{ border-top-color:var(--danger); }
  .stat-accent{ border-top-color:var(--accent); }
  .stat-label{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  .stat-value{ font-family:var(--font-display); font-size:25px; font-weight:700; margin-top:4px; }
  .stat-sub{ font-size:12px; color:var(--muted); margin-top:2px; }

  .panel{ padding:18px; margin-bottom:16px; }
  .panel-title{ font-size:14.5px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .panel-title small{ font-weight:500; color:var(--muted); font-size:11.5px; }

  .empty{ padding:34px 18px; text-align:center; color:var(--muted); }
  .empty-icon{ width:40px; height:40px; margin:0 auto 10px; color:var(--muted); opacity:.6; }
  .empty-title{ color:var(--ink); font-weight:700; margin-bottom:4px; font-size:14.5px; }

  /* ---------- badges ---------- */
  .badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700; letter-spacing:.01em; }
  .badge-ok{ background:var(--primary-soft); color:var(--accent); }
  .badge-low{ background:var(--danger-soft); color:var(--danger); }
  .badge-out{ background:var(--surface-2); color:var(--muted); }

  /* ---------- rows list ---------- */
  .rows{ display:flex; flex-direction:column; }
  .row{ grid-template-columns: 1fr auto auto auto; }
  .row-cols-2{ grid-template-columns: 1fr auto; }
  .row-cols-3{ grid-template-columns: 1fr auto auto; }
  .row-cols-3b{ grid-template-columns: auto 1fr auto; }
  .row-cols-4{ grid-template-columns: auto 1fr auto auto; }
  .row, .row-cols-2, .row-cols-3, .row-cols-3b, .row-cols-4{
    display:grid; align-items:center; gap:14px;
    padding:12px 4px; border-bottom:1px solid var(--border);
  }
  .row:last-child, .row-cols-2:last-child, .row-cols-3:last-child, .row-cols-3b:last-child, .row-cols-4:last-child{ border-bottom:none; }
  .row-main{ min-width:0; }
  .row-title{ font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-title.linklike{ cursor:pointer; }
  .row-title.linklike:hover{ text-decoration:underline; }
  .row-sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .row-num{ font-weight:600; text-align:right; }
  .row-actions{ display:flex; gap:6px; flex-wrap:wrap; }

  @media (max-width:680px){
    .row, .row-cols-2, .row-cols-3, .row-cols-3b, .row-cols-4{
      grid-template-columns:1fr; row-gap:8px; padding:13px 12px; border:1px solid var(--border);
      border-radius:var(--radius-md); margin-bottom:8px;
    }
    .row:last-child, .row-cols-2:last-child, .row-cols-3:last-child, .row-cols-3b:last-child, .row-cols-4:last-child{ margin-bottom:0; }
    .row-num{ text-align:left; }
    .row-actions{ justify-content:flex-start; }
  }

  .search{
    display:flex; align-items:center; gap:8px; padding:9px 13px; border:1px solid var(--border);
    border-radius:var(--radius-md); background:var(--surface); margin-bottom:14px;
  }
  .search input{ border:none; background:transparent; outline:none; flex:1; min-width:0; }
  .search .icon{ color:var(--muted); flex:none; }

  /* ---------- forms ---------- */
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--muted); }
  .field input, .field select, .field textarea{
    padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--ink); width:100%;
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:480px){ .field-row{ grid-template-columns:1fr; } }
  .field-hint{ font-size:11.5px; color:var(--muted); }

  /* ---------- POS ---------- */
  .pos-layout{ display:grid; grid-template-columns:1.4fr 1fr; gap:18px; align-items:start; }
  @media (max-width:860px){ .pos-layout{ grid-template-columns:1fr; } }

  .pick-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .pick-card{
    border:1px solid var(--border); border-radius:var(--radius-md); padding:12px; background:var(--surface);
    display:flex; flex-direction:column; gap:8px;
  }
  .pick-name{ font-weight:600; font-size:13.5px; line-height:1.3; }
  .pick-meta{ font-size:11.5px; color:var(--muted); }
  .pick-price{ font-weight:700; color:var(--accent); font-size:14.5px; }
  .pick-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; }

  .stepper{ display:flex; align-items:center; gap:8px; }
  .stepper button{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; font-weight:700; line-height:1;
  }
  .stepper .qty{ min-width:18px; text-align:center; font-weight:700; }

  .cart{ position:static; }
  @media (min-width:861px){ .cart{ position:sticky; top:78px; } }
  .cart-items{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; max-height:300px; overflow-y:auto; }
  .cart-item{ display:flex; align-items:center; gap:10px; }
  .cart-item-main{ flex:1; min-width:0; }
  .cart-item-name{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cart-item-price{ font-size:11.5px; color:var(--muted); }
  .cart-item-sub{ font-weight:700; font-size:13px; width:70px; text-align:right; }
  .cart-empty{ text-align:center; color:var(--muted); font-size:13px; padding:18px 4px; }
  .cart-total-row{ display:flex; align-items:baseline; justify-content:space-between; padding-top:10px; border-top:1px solid var(--border); margin-top:4px; }
  .cart-total-label{ font-weight:600; font-size:13px; color:var(--muted); }
  .cart-total-value{ font-family:var(--font-display); font-size:24px; font-weight:700; }

  /* ---------- clients ---------- */
  .client-card{ display:flex; align-items:center; gap:10px; }
  .client-avatar{ width:36px; height:36px; border-radius:50%; background:var(--primary-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:none; }
  .client-info-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .client-info-row:last-child{ border-bottom:none; }
  .client-info-row span:first-child{ color:var(--muted); }

  /* ---------- charts ---------- */
  .charts-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:780px){ .charts-grid{ grid-template-columns:1fr; } }

  .chart-vbar{ display:flex; align-items:flex-end; gap:8px; height:150px; padding-top:22px; }
  .vbar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; min-width:0; }
  .vbar-value{ font-size:10.5px; font-weight:700; color:var(--ink); white-space:nowrap; }
  .vbar-track{ width:100%; max-width:30px; background:var(--surface-2); border-radius:4px; flex:1; display:flex; align-items:flex-end; overflow:hidden; }
  .vbar-fill{ width:100%; background:var(--primary); border-radius:4px 4px 0 0; min-height:4px; }
  .vbar-col.is-today .vbar-fill{ background:var(--accent); }
  .vbar-daylabel{ font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

  .hbar-row{ display:grid; grid-template-columns:96px 1fr 56px; align-items:center; gap:8px; margin-bottom:10px; }
  .hbar-row:last-child{ margin-bottom:0; }
  .hbar-label{ font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar-track{ background:var(--surface-2); border-radius:4px; height:14px; }
  .hbar-fill{ background:var(--primary); height:100%; border-radius:0 4px 4px 0; min-width:6px; }
  .hbar-value{ font-size:11.5px; font-weight:700; text-align:right; }
  @media (max-width:420px){
    .hbar-row{ grid-template-columns:72px 1fr 44px; gap:6px; }
    .chart-vbar{ gap:5px; height:130px; }
    .vbar-track{ max-width:22px; }
  }

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(8,14,10,0.45); z-index:100;
    display:flex; align-items:flex-end; justify-content:center; padding:0;
  }
  @media (min-width:640px){ .modal-backdrop{ align-items:center; padding:20px; } }
  .modal-backdrop[hidden]{ display:none; }
  .modal{
    background:var(--surface); width:100%; max-width:480px; max-height:92vh; overflow-y:auto;
    border-radius:18px 18px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:var(--shadow);
  }
  @media (min-width:640px){ .modal{ border-radius:var(--radius-lg); } }
  .modal[hidden]{ display:none; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px; }
  .modal-title{ font-size:17px; font-weight:700; }
  .modal-foot{ display:flex; gap:10px; margin-top:6px; }
  .modal-foot .btn{ flex:1; }
  .modal-receipt{ max-width:420px; padding-top:14px; }

  /* ---------- receipt ---------- */
  .receipt-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .segmented{ display:inline-flex; border:1px solid var(--border); border-radius:99px; padding:2px; }
  .segmented button{ border:none; background:transparent; padding:5px 12px; border-radius:99px; font-size:12px; font-weight:700; color:var(--muted); }
  .segmented button.active{ background:var(--primary); color:var(--primary-ink); }
  .receipt{
    background:#fff; color:#111; border:1px dashed #bbb; border-radius:8px; margin:0 auto;
    padding:18px 16px; width:280px; font-size:12px; line-height:1.5;
  }
  .receipt[data-format="sheet"]{ width:100%; max-width:440px; padding:30px; font-size:13.5px; }
  .receipt-logo{ display:block; width:34px; height:34px; border-radius:9px; margin:0 auto 6px; object-fit:cover; }
  .receipt-brand{ font-family:var(--font-display); font-weight:700; font-size:17px; text-align:center; }
  .receipt-line2{ text-align:center; font-size:11px; color:#555; margin-top:2px; }
  .receipt-hr{ border:none; border-top:1px dashed #bbb; margin:10px 0; }
  .receipt-meta{ display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:2px; }
  .receipt-items{ display:flex; flex-direction:column; gap:6px; margin:8px 0; }
  .receipt-item{ display:flex; gap:6px; align-items:baseline; }
  .receipt-item-name{ flex:1; min-width:0; }
  .receipt-item-qty{ color:#555; }
  .receipt-item-sub{ font-weight:700; text-align:right; min-width:64px; }
  .receipt-total{ display:flex; justify-content:space-between; align-items:baseline; font-weight:700; font-size:15px; margin-top:6px; }
  .receipt-footer{ text-align:center; font-size:11px; color:#555; margin-top:12px; }

  @media print{
    body *{ visibility:hidden; }
    #receiptPrintArea, #receiptPrintArea *{ visibility:visible; }
    #receiptPrintArea{ position:absolute; top:0; left:0; width:100%; }
    .receipt{ border:none; margin:0 auto; }
    @page{ margin:8mm; }
  }
  .no-print{}

  /* ---------- toast ---------- */
  #toast-container{ position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; padding:0 14px; pointer-events:none; }
  .toast{
    background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:99px; font-size:13px; font-weight:600;
    box-shadow:var(--shadow); max-width:92vw; text-align:center;
  }
  .toast-error{ background:var(--danger); color:#fff; }

  .sync-banner{ background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:600; padding:8px 14px; text-align:center; }
  .sync-banner[hidden]{ display:none; }

  .settings-note{ font-size:12px; color:var(--muted); margin-bottom:12px; }
</style>

<div id="app">
  <div id="toast-container" class="no-print" aria-live="polite"></div>

  <header class="topbar no-print">
    <div class="topbar-left">
      <button class="icon-btn hamburger-btn" id="btnMenu" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidenav">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
      </button>
      <div class="brand">
        <img class="brand-logo" id="brandLogo" alt="Logo">

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function money(n){
    n = Math.round(Number(n) || 0);
    return "$" + n.toLocaleString("es-AR");
  }
  function pad4(n){ return String(n).padStart(4,"0"); }
  function todayKey(d){ d = d || new Date(); return d.toDateString(); }
  function startOfToday(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  function startOfMonth(){ var d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; }
  function daysAgo(n){ var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-n); return d; }
  function fmtDateTime(iso){
    var d = new Date(iso);
    var datePart = d.toLocaleDateString("es-AR", { day:"2-digit", month:"2-digit", year:"numeric" });
    var timePart = d.toLocaleTimeString("es-AR", { hour:"2-digit", minute:"2-digit" });
    return datePart + " " + timePart;
  }
  function byName(a,b){ return a.name.localeCompare(b.name, "es"); }
  function isLow(p){ return Number(p.stock) <= Number(p.minStock != null ? p.minStock : 5); }
  function isOut(p){ return Number(p.stock) <= 0; }

    var c = document.getElementById("toast-container");
    var el = document.createElement("div");
    el.className = "toast" + (type === "error" ? " toast-error" : "");
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(function(){ el.style.opacity = "0"; el.style.transition = "opacity .3s"; }, 2200);
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 2600);
  }

  function build7DayChart(){
    var cols = [];
    for (var i = 6; i >= 0; i--){
      var dayStart = daysAgo(i);
      var dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate()+1);
      var total = sales.reduce(function(sum,s){
        var d = new Date(s.date);
        return (d >= dayStart && d < dayEnd) ? sum + s.total : sum;
      }, 0);
      cols.push({ label: dayStart.toLocaleDateString("es-AR", { weekday:"short" }).replace(".",""), total: total, isToday: i === 0, dateLabel: dayStart.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"}) });
    }
    var max = Math.max.apply(null, cols.map(function(c){ return c.total; }).concat([1]));
    return '<div class="chart-vbar">' + cols.map(function(c){
      var pct = Math.max(4, Math.round((c.total / max) * 100));
      return '<div class="vbar-col ' + (c.isToday ? "is-today" : "") + '" title="' + c.dateLabel + ': ' + money(c.total).replace(/"/g,"") + '">' +
        (c.isToday ? '<div class="vbar-value num">' + money(c.total) + '</div>' : '') +
        '<div class="vbar-track"><div class="vbar-fill" style="height:' + pct + '%"></div></div>' +
        '<div class="vbar-daylabel">' + (c.isToday ? "Hoy" : escapeHtml(c.label)) + '</div>' +
      '</div>';
    }).join("") + '</div>';
  }

  function buildTopProductsChart(){
    var qtyByProduct = {};
    var nameByProduct = {};
    sales.forEach(function(s){
      s.items.forEach(function(it){
        var key = it.productId || it.name;
        qtyByProduct[key] = (qtyByProduct[key] || 0) + it.qty;
        nameByProduct[key] = it.name;
      });
    });
    var list = Object.keys(qtyByProduct).map(function(k){ return { name: nameByProduct[k], qty: qtyByProduct[k] }; })
      .sort(function(a,b){ return b.qty - a.qty; }).slice(0,5);
    if (list.length === 0){
      return '<div class="empty" style="padding:18px 4px;">Todavía no hay ventas para mostrar un ranking.</div>';
    }
    var max = Math.max.apply(null, list.map(function(x){ return x.qty; }));
    return list.map(function(x){
      var pct = Math.max(6, Math.round((x.qty / max) * 100));
      return '<div class="hbar-row"><div class="hbar-label" title="' + escapeHtml(x.name) + '">' + escapeHtml(x.name) + '</div>' +
        '<div class="hbar-track"><div class="hbar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="hbar-value num">' + x.qty + ' u.</div></div>';
    }).join("");
  }

  function renderStockList(){
    var wrap = document.getElementById("stockListWrap");

    if (products.length === 0){
      wrap.innerHTML = '<div class="empty">' + ICONS.box + '<div class="empty-title">Sin productos todavía</div><p>Agregá tu primera bebida con nombre, precio y stock.</p></div>';
      return;

      wrap.innerHTML = '<div class="empty">No encontramos productos que coincidan con "' + escapeHtml(stockFilter) + '".</div>';
      return;
    }

    wrap.innerHTML = '<div class="rows">' + list.map(function(p){
      var badge = isOut(p) ? '<span class="badge badge-out">Sin stock</span>' : (isLow(p) ? '<span class="badge badge-low">Stock bajo</span>' : '<span class="badge badge-ok">OK</span>');

        '<div class="row-main"><div class="row-title">' + escapeHtml(p.name) + '</div><div class="row-sub">' + escapeHtml(p.category || "Sin categoría") + ' · ' + money(p.price) + ' / ' + escapeHtml(p.unit || "u.") + '</div></div>' +

          '<button class="icon-btn btn-sm" data-del="' + p.id + '" title="Eliminar" style="width:32px;height:32px;color:var(--danger);">' + ICONS.trash + '</button>' +
        '</div>' +
      '</div>';
    }).join("") + '</div>';

    Array.prototype.forEach.call(wrap.querySelectorAll("[data-edit]"), function(b){
      b.addEventListener("click", function(){ openProductModal(b.getAttribute("data-edit")); });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll("[data-adjust]"), function(b){
      b.addEventListener("click", function(){ openStockModal(b.getAttribute("data-adjust")); });

  function openStockModal(id){
    var p = products.find(function(x){ return x.id === id; });
    if (!p) return;
    var m = document.getElementById("modal-stock");
    m.innerHTML =
      '<div class="modal-head"><h2 class="modal-title">Ajustar stock</h2><button class="icon-btn" id="smClose">✕</button></div>' +
      '<p class="settings-note">' + escapeHtml(p.name) + ' · stock actual: <strong class="num">' + p.stock + ' ' + escapeHtml(p.unit || "u.") + '</strong></p>' +
      '<div class="field"><label for="smDelta">Sumar o restar unidades</label>' +
        '<div style="display:flex;gap:8px;">' +
          '<button type="button" class="btn" id="smMinus" style="flex:none;">−10</button>' +
          '<input id="smDelta" type="number" step="1" value="0" style="text-align:center;border:1px solid var(--border);border-radius:8px;padding:10px;flex:1;">' +
          '<button type="button" class="btn" id="smPlus" style="flex:none;">+10</button>' +
        '</div><span class="field-hint">Usalo para cargar mercadería nueva (positivo) o corregir el conteo (negativo).</span>' +
      '</div>' +
      '<div class="field"><label for="smSet">O directamente fijar el stock en</label><input id="smSet" type="number" min="0" step="1" placeholder="' + p.stock + '"></div>' +
      '<div class="modal-foot"><button type="button" class="btn" id="smCancel">Cancelar</button><button type="button" class="btn btn-primary" id="smSave">Guardar</button></div>';
    openModal("modal-stock");
    document.getElementById("smClose").addEventListener("click", closeModal);
    document.getElementById("smCancel").addEventListener("click", closeModal);
    document.getElementById("smMinus").addEventListener("click", function(){
      var i = document.getElementById("smDelta"); i.value = (Number(i.value)||0) - 10;
    });
    document.getElementById("smPlus").addEventListener("click", function(){
      var i = document.getElementById("smDelta"); i.value = (Number(i.value)||0) + 10;
    });
    document.getElementById("smSave").addEventListener("click", function(){
      var setVal = document.getElementById("smSet").value;
      var newStock;
      if (setVal !== ""){
        newStock = Math.max(0, Math.round(Number(setVal)));
      } else {
        var delta = Number(document.getElementById("smDelta").value) || 0;
        newStock = Math.max(0, Math.round(p.stock + delta));
      }
      setProductStock(p.id, newStock).then(function(){
        toast("Stock actualizado.");
        closeModal();
      });
    });

  function renderPickGrid(){
    var grid = document.getElementById("pickGrid");
    if (!grid) return;

      grid.innerHTML = '<div class="card empty" style="grid-column:1/-1;">' + ICONS.box + '<div class="empty-title">No hay productos cargados</div><p>Andá a Stock para agregar tus bebidas.</p><div style="margin-top:14px;"><button class="btn btn-primary" id="posGoStock">Ir a Stock</button></div></div>';

    }
    var q = posFilter.trim().toLowerCase();

        '<div class="pick-foot"><span class="pick-price num">' + money(p.price) + '</span>' +
        (out ? '<span class="badge badge-out">Sin stock</span>' :
          (qty > 0 ?
            '<div class="stepper"><button data-cart-minus="' + p.id + '">−</button><span class="qty num">' + qty + '</span><button data-cart-plus="' + p.id + '">+</button></div>'
            : '<button class="btn btn-sm btn-primary" data-add="' + p.id + '">Agregar</button>'
          )
        ) +
        '</div></div>';

    Array.prototype.forEach.call(grid.querySelectorAll("[data-add]"), function(b){

      b.addEventListener("click", function(){ changeCartQty(b.getAttribute("data-cart-plus"), 1); });
    });

  function addToCart(productId){
    var p = products.find(function(x){ return x.id === productId; });
    if (!p || p.stock <= 0) return;
    var item = cart.find(function(c){ return c.productId === productId; });
    if (item){
      if (item.qty < p.stock) item.qty += 1; else { toast("No hay más stock disponible de " + p.name + ".", "error"); }
    } else {
      cart.push({ productId:p.id, name:p.name, unit:p.unit, price:p.price, qty:1 });
    }
    renderPickGrid();
    renderCart();
  }
  function changeCartQty(productId, delta){
    var item = cart.find(function(c){ return c.productId === productId; });
    if (!item) return;
    var p = products.find(function(x){ return x.id === productId; });
    var maxQty = p ? p.stock : item.qty;
    item.qty += delta;
    if (item.qty > maxQty){ item.qty = maxQty; toast("No hay más stock disponible.", "error"); }
    if (item.qty <= 0) cart = cart.filter(function(c){ return c.productId !== productId; });
    renderPickGrid();
    renderCart();
  }
  function cartTotal(){ return cart.reduce(function(a,c){ return a + c.price * c.qty; }, 0); }

  function renderCart(){
    var panel = document.getElementById("cartPanel");
    if (!panel) return;
    var selectedClientId = renderCart._clientId || "";
    var clientOptions = clients.slice().sort(byName).map(function(c){
      return '<option value="' + c.id + '"' + (selectedClientId === c.id ? " selected" : "") + '>' + escapeHtml(c.name) + (c.phone ? " · " + escapeHtml(c.phone) : "") + '</option>';
    }).join("");

    panel.innerHTML =
      '<div class="panel-title"><span>Boleta</span>' + (cart.length ? '<button class="btn btn-ghost btn-sm" id="cartClear">Vaciar</button>' : '') + '</div>' +
      '<div class="cart-items" id="cartItems">' + (cart.length ? cart.map(function(c){
        return '<div class="cart-item"><div class="cart-item-main"><div class="cart-item-name">' + escapeHtml(c.name) + '</div><div class="cart-item-price">' + c.qty + ' × ' + money(c.price) + '</div></div>' +
          '<div class="stepper"><button data-cm="' + c.productId + '">−</button><span class="qty num">' + c.qty + '</span><button data-cp="' + c.productId + '">+</button></div>' +
          '<div class="cart-item-sub num">' + money(c.price * c.qty) + '</div></div>';
      }).join("") : '<div class="cart-empty">Todavía no agregaste productos.</div>') + '</div>' +
      '<div class="field"><label for="cartClientSelect">Cliente</label><select id="cartClientSelect">' +
        '<option value=""' + (selectedClientId === "" ? " selected" : "") + '>Cliente ocasional</option>' +
        clientOptions +
        '<option value="__new__">+ Nuevo cliente…</option>' +
      '</select></div>' +
      (selectedClientId === "" ? '<div class="field" id="cartClienteNameWrap"><label for="cartClienteName">Nombre (opcional)</label><input id="cartClienteName" placeholder="Nombre del cliente"></div>' : "") +
      '<div class="cart-total-row"><span class="cart-total-label">Total</span><span class="cart-total-value num">' + money(cartTotal()) + '</span></div>' +
      '<button class="btn btn-primary btn-block" id="cartConfirm" style="margin-top:12px;" ' + (cart.length ? "" : "disabled") + '>Emitir boleta</button>';

    var clienteNameInput = document.getElementById("cartClienteName");
    if (clienteNameInput){
      clienteNameInput.value = renderCart._clienteName || "";
      clienteNameInput.addEventListener("input", function(){ renderCart._clienteName = clienteNameInput.value; });
    }

    var clientSelect = document.getElementById("cartClientSelect");
    clientSelect.addEventListener("change", function(){
      if (clientSelect.value === "__new__"){
        openClientModal(null, function(newClient){
          renderCart._clientId = newClient.id;
          renderCart();
        });
        clientSelect.value = selectedClientId;
        return;
      }
      renderCart._clientId = clientSelect.value;
      renderCart();
    });

    var clearBtn = document.getElementById("cartClear");
    if (clearBtn) clearBtn.addEventListener("click", function(){ cart = []; renderPickGrid(); renderCart(); });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-cp]"), function(b){ b.addEventListener("click", function(){ changeCartQty(b.getAttribute("data-cp"), 1); }); });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-cm]"), function(b){ b.addEventListener("click", function(){ changeCartQty(b.getAttribute("data-cm"), -1); }); });

    var confirmBtn = document.getElementById("cartConfirm");
    if (confirmBtn) confirmBtn.addEventListener("click", confirmSale);
  }

  function confirmSale(){
    if (cart.length === 0) return;
    for (var i = 0; i < cart.length; i++){
      var c = cart[i];
      var p = products.find(function(x){ return x.id === c.productId; });
      if (!p || p.stock < c.qty){
        toast("Stock insuficiente de " + c.name + ". Actualizá la cantidad.", "error");
        renderPickGrid(); renderCart();
        return;
      }
    }
    var clientId = renderCart._clientId || "";
    var client = clientId ? clients.find(function(x){ return x.id === clientId; }) : null;
    var clienteNameField = document.getElementById("cartClienteName");
    var nextNumber = sales.reduce(function(m,s){ return Math.max(m, s.number || 0); }, 0) + 1;
    var sale = {
      id: uid(),
      number: nextNumber,
      date: new Date().toISOString(),
      clientId: client ? client.id : "",
      cliente: client ? client.name : (clienteNameField ? clienteNameField.value.trim() : ""),
      items: cart.map(function(c){ return { productId:c.productId, name:c.name, unit:c.unit, price:c.price, qty:c.qty, subtotal:c.price*c.qty }; }),
      total: cartTotal()
    };

    var chain = Promise.resolve();
    var lowStockWarnings = [];
    cart.forEach(function(c){
      var p = products.find(function(x){ return x.id === c.productId; });
      var newStock = Math.max(0, p.stock - c.qty);
      if (newStock <= Number(p.minStock != null ? p.minStock : 5)) lowStockWarnings.push(p.name);
      chain = chain.then(function(){ return setProductStock(c.productId, newStock); });
    });
    chain.then(function(){ return persistSale(sale); }).then(function(){
      cart = [];
      renderCart._clienteName = "";
      renderCart._clientId = "";
      toast("Boleta N°" + pad4(sale.number) + " emitida.");
      lowStockWarnings.forEach(function(name){ toast("Quedan pocas unidades de " + name + ".", "error"); });
      renderPickGrid();
      renderCart();
      openReceiptModal(sale);
    }).catch(function(err){
      toast("No se pudo emitir la boleta. Intentá de nuevo.", "error");
    });
  }

        '<div class="field"><label for="sgAddress">Dirección (opcional)</label><input id="sgAddress" value="' + escapeHtml(settings.address) + '"></div>' +
        '<div class="field"><label for="sgPhone">Teléfono (opcional)</label><input id="sgPhone" value="' + escapeHtml(settings.phone) + '"></div>' +
        '<div class="field"><label for="sgFooter">Mensaje de pie de boleta</label><input id="sgFooter" value="' + escapeHtml(settings.footer) + '"></div>' +
        '<div class="modal-foot"><button type="button" class="btn" id="stgCancel">Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div>' +
      '</form>';
    openModal("modal-settings");
    document.getElementById("stgClose").addEventListener("click", closeModal);
    document.getElementById("stgCancel").addEventListener("click", closeModal);
    document.getElementById("settingsForm").addEventListener("submit", function(e){
      e.preventDefault();
      var s = {
        businessName: document.getElementById("sgName").value.trim() || "Milo Drinks",
        tagline: document.getElementById("sgTagline").value.trim(),
        address: document.getElementById("sgAddress").value.trim(),
        phone: document.getElementById("sgPhone").value.trim(),
        footer: document.getElementById("sgFooter").value.trim() || "¡Gracias por tu compra!"
      };
      persistSettings(s).then(function(){
        toast("Datos del negocio guardados.");
        closeModal();
      });
    });
  }

  /* ================= confirm dialog ================= */
  function confirmDialog(title, message, confirmLabel){
    return new Promise(function(resolve){
      var m = document.getElementById("modal-confirm");
      m.innerHTML =
        '<div class="modal-head"><h2 class="modal-title">' + escapeHtml(title) + '</h2></div>' +
        '<p style="margin-bottom:16px;color:var(--muted);">' + escapeHtml(message) + '</p>' +
        '<div class="modal-foot"><button class="btn" id="cfCancel">Cancelar</button><button class="btn btn-danger" id="cfOk">' + escapeHtml(confirmLabel || "Confirmar") + '</button></div>';
      openModal("modal-confirm");
      document.getElementById("cfCancel").addEventListener("click", function(){ closeModal(); resolve(false); });
      document.getElementById("cfOk").addEventListener("click", function(){ closeModal(); resolve(true); });
    });
  }

  /* ================= modal plumbing ================= */
  var MODAL_IDS = ["modal-product","modal-stock","modal-settings","modal-confirm","modal-client","modal-client-detail","modal-receipt"];
  function openModal(id){
    document.getElementById("backdrop").hidden = false;
    MODAL_IDS.forEach(function(m){
      document.getElementById(m).hidden = (m !== id);
    });
  }
  function closeModal(){
    document.getElementById("backdrop").hidden = true;
  }
  document.getElementById("backdrop").addEventListener("click", function(e){
    if (e.target === e.currentTarget) closeModal();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ closeModal(); closeDrawer(); }
  });
  document.getElementById("navBackdrop").addEventListener("click", closeDrawer);

  /* ================= storage layer ================= */
  function saveProduct(product){
    if (mode === "db"){
      return db.collection("products").doc(product.id).set(product);
    }
    var idx = products.findIndex(function(p){ return p.id === product.id; });
    if (idx >= 0) products[idx] = product; else products.push(product);
    localSet("products", products);
    onProductsChanged();
    return Promise.resolve();
  }
  function removeProduct(id){
    if (mode === "db"){
      return db.collection("products").doc(id).delete();
    }
    products = products.filter(function(p){ return p.id !== id; });
    localSet("products", products);
    onProductsChanged();
    return Promise.resolve();
  }
  function setProductStock(id, newStock){
    if (mode === "db"){
      return db.collection("products").doc(id).update({ stock:newStock });
    }
    var p = products.find(function(x){ return x.id === id; });
    if (p) p.stock = newStock;
    localSet("products", products);
    onProductsChanged();
    return Promise.resolve();
  }
  function persistSale(sale){
    if (mode === "db"){
      return db.collection("sales").doc(sale.id).set(sale);
    }
    sales.push(sale);
    localSet("sales", sales);
    onSalesChanged();
    return Promise.resolve();
  }
  function persistSettings(s){
    settings = s;
    if (mode === "db"){
      return db.doc("settings/business").set(s);
    }
    localSet("settings", s);
    onSettingsChanged();
    return Promise.resolve();
  }
  function saveClient(client){
    if (mode === "db"){
      return db.collection("clients").doc(client.id).set(client);
    }
    var idx = clients.findIndex(function(c){ return c.id === client.id; });
    if (idx >= 0) clients[idx] = client; else clients.push(client);
    localSet("clients", clients);
    onClientsChanged();
    return Promise.resolve();
  }
  function removeClient(id){
    if (mode === "db"){
      return db.collection("clients").doc(id).delete();
    }
    clients = clients.filter(function(c){ return c.id !== id; });
    localSet("clients", clients);
    onClientsChanged();
    return Promise.resolve();
  }

  function onProductsChanged(){
    if (currentView === "dashboard") renderDashboard();
    if (currentView === "stock") renderStockList();
    if (currentView === "pos") renderPickGrid();
  }
  function onSalesChanged(){
    if (currentView === "dashboard") renderDashboard();
    if (currentView === "historial") renderHistorialList();
  }
  function onClientsChanged(){
    if (currentView === "dashboard") renderDashboard();
    if (currentView === "clients") renderClientsList();
    if (currentView === "pos") renderCart();
  }
  function onSettingsChanged(){
    document.getElementById("brandName").textContent = settings.businessName || "Milo Drinks";
    document.getElementById("brandSub").textContent = settings.tagline || "Distribuidora Mayorista";
  }

  /* ================= boot ================= */
  function setSyncBanner(text){
    var b = document.getElementById("syncBanner");
    if (!text){ b.hidden = true; b.textContent = ""; }
    else { b.hidden = false; b.textContent = text; }
  }

  function tickClock(){
    var d = new Date();
    document.getElementById("topbarDate").textContent = d.toLocaleDateString("es-AR", { weekday:"long", day:"numeric", month:"long" });
  }

  function boot(){
    document.getElementById("brandLogo").src = LOGO_DATA_URI;
    renderNav();
    switchView("dashboard");
    tickClock();
    setInterval(tickClock, 60000);

    document.getElementById("btnSettings").addEventListener("click", openSettingsModal);
    document.getElementById("btnMenu").addEventListener("click", toggleDrawer);

    window.addEventListener("resize", function(){
      if (window.innerWidth >= 1024) closeDrawer();
    });

    initStorage();
  }

  function initStorage(){
    setSyncBanner("Conectando almacenamiento...");
    var settled = false;
    var fallbackTimer = setTimeout(function(){
      if (!settled) goLocal();
    }, 10000);

    function goLocal(){
      if (settled) return;
      settled = true;
      clearTimeout(fallbackTimer);
      mode = "local";
      products = localGet("products", []);
      sales = localGet("sales", []);
      clients = localGet("clients", []);
      settings = localGet("settings", settings);
      onSettingsChanged();
      onProductsChanged();
      onSalesChanged();
      onClientsChanged();
      setSyncBanner("No se pudo sincronizar en la nube: los datos se guardan solo en este dispositivo/navegador.");
    }

    try{
      if (window.claude && typeof window.claude.use === "function"){
        window.claude.use("db").then(function(dbApi){
          if (settled) return;
          if (!dbApi){ goLocal(); return; }
          settled = true;
          clearTimeout(fallbackTimer);
          db = dbApi;
          mode = "db";
          setSyncBanner(null);

          db.collection("products").onSnapshot(function(snap){
            products = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
            onProductsChanged();
          }, function(err){
            setSyncBanner("Problema de sincronización de productos: " + err.message);
          });

          db.collection("sales").onSnapshot(function(snap){
            sales = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
            onSalesChanged();
          }, function(err){
            setSyncBanner("Problema de sincronización de boletas: " + err.message);
          });

          db.collection("clients").onSnapshot(function(snap){
            clients = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
            onClientsChanged();
          }, function(err){
            setSyncBanner("Problema de sincronización de clientes: " + err.message);
          });

          db.doc("settings/business").onSnapshot(function(snap){
            if (snap.exists) settings = snap.data();
            onSettingsChanged();
          }, function(err){ /* keep defaults */ });
        }).catch(function(){ goLocal(); });
      } else {
        goLocal();
      }
    }catch(e){
      goLocal();
    }
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
